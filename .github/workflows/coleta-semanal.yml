name: Coleta semanal e publicação

on:
  schedule:
    # Sexta-feira 12:00 em Brasília (America/Sao_Paulo, UTC-3 fixo, sem horário de verão) = 15:00 UTC.
    # O GitHub agenda em UTC. Se o Brasil voltar ao horário de verão, ajuste para 14:00 UTC.
    # Execuções agendadas podem atrasar alguns minutos em horários de pico.
    - cron: "0 15 * * 5"
  workflow_dispatch:
    inputs:
      only:
        description: "Opcional: coletar só uma fonte (id de config/sources.yml)"
        required: false
        default: ""
  push:
    branches: [main]
    paths: ["docs/**", "config/**", "collector/**", ".github/workflows/coleta-semanal.yml"]

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  collect:
    # Alterações no código/site (push) só republicam; a coleta roda no agendamento ou manualmente.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Testes do coletor
        run: python -m pytest -q tests
      - name: Coleta
        id: collect
        continue-on-error: true
        env:
          ONLY: ${{ github.event.inputs.only }}
        run: |
          if [ -n "$ONLY" ]; then python -m collector.run --only "$ONLY"; else python -m collector.run; fi
      - name: Salvar dados no repositório (inclui log da execução, mesmo em falha)
        run: |
          git config user.name "radar-inteligente-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "Sem alterações nos dados."
          else
            git commit -m "Coleta: atualiza dados do radar"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Marcar falha se a coleta falhou totalmente
        if: steps.collect.outcome == 'failure'
        run: |
          echo "A coleta falhou em todas as fontes automáticas. A última base válida foi preservada."
          exit 1

  deploy:
    needs: [collect]
    # Publica sempre (inclusive após falha, para o site mostrar o status e a última base válida).
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
