# Regras de classificação (sem IA paga). Tudo editável.
# Os termos são comparados sem diferença de maiúsculas/acentos.

scoring:
  reliability_points: {official: 30, specialist: 20, journalistic: 15}
  recency:            # (dias desde a publicação) -> pontos
    - {max_days: 2,  points: 15}
    - {max_days: 7,  points: 12}
    - {max_days: 14, points: 8}
    - {max_days: 30, points: 4}
  topic_points_per_hit: 5
  topic_points_cap: 25
  urgency_points_per_hit: 5
  urgency_points_cap: 15
  client_confirmed_points: 15
  deadline_bonus: {within_days: 45, points: 10}   # prazo futuro próximo citado na publicação
  levels: {critical: 80, high: 60, medium: 40}
  # Crítica exige TAMBÉM: fonte oficial + termo de obrigação/prazo + data de publicação confirmada.

