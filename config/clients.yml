#   name      grafia exibida na interface (não alterar sem necessidade)
#   aliases   variações de nome, razão social e marcas usadas na busca
#   context   palavras que ajudam a CONFIRMAR a identidade da empresa em um texto
#   ambiguous true  = o nome é curto/genérico. Só confirma a associação se alguma
#                     palavra de "context" aparecer junto. Sem "context", a notícia
#                     vira "Associação não confirmada".
#   query     (opcional) termo usado na busca de notícias; padrão = name
